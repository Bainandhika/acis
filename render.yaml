services:
  - type: web
    name: acis-backend
    env: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 15m
      - key: OTP_ENCRYPTION_KEY
        sync: false
      - key: OTP_TTL
        value: 5m
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: onboarding@resend.dev
      - key: CORS_ALLOWED_ORIGINS
        sync: false
