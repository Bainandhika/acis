server:
  port: "${PORT:8080}"
  mode: "${GIN_MODE:debug}"

database:
  host: "${DB_HOST:localhost}"
  port: "${DB_PORT:5432}"
  user: "${DB_USER:acis_user}"
  password: "${DB_PASSWORD}"
  name: "${DB_NAME:acis_db}"
  ssl_mode: "${DB_SSLMODE:disable}"
  time_zone: "${DB_TIMEZONE:Asia/Jakarta}"

jwt:
  secret: "${JWT_SECRET}"
  expiry: "${JWT_EXPIRY:24h}"

log:
  dir: "${LOG_DIR:./logs}"
  level: "${LOG_LEVEL:info}"

redis:
  host: "${REDIS_HOST:localhost}"
  port: "${REDIS_PORT:6379}"
  password: "${REDIS_PASSWORD:}"
  db: "${REDIS_DB:0}"

otp:
  ttl: "${OTP_TTL:5m}"
  encryption_key: "${OTP_ENCRYPTION_KEY:acis_secret_otp_encryption_key_32bytes!!}"

